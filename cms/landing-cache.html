\"Spectacle de danse de kintsugi \",\"slug\":\"kintsugi\",\"summary\":null,\"description\":\"ateliers les 31 octobre et 14 et 28 novembre !\",\"category\":\"evenement\",\"startTime\":\"2026-11-27T23:00:00.000Z\",\"endTime\":\"2026-11-27T23:00:00.000Z\",\"registrationRequired\":true,\"registrationDeadline\":\"2026-11-27T16:00:00.000Z\",\"capacity\":40,\"createdAt\":\"2026-09-26T04:11:48.898Z\",\"updatedAt\":\"2026-09-26T04:18:35.162Z\",\"publishedAt\":\"2026-09-26T04:18:35.173Z\",\"locale\":\"fr\",\"location\":\"Gaztelu - 1, rue de la Halle, 64700 Hendaye\",\"pricingType\":\"pay_what_you_want\",\"price\":null}],\"action\":[],\"resources\":[{\"id\":8,\"documentId\":\"ritmw5urp8u3z6qmu9rgfni4\",\"title\":\" Numéros utiles\",\"slug\":\"numeros-utiles\",\"summary\":\"Les principaux numéros à connaître en cas de besoin.\",\"description\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Une sélection de contacts utiles pour l'écoute, l'urgence et l'accompagnement.\"}]}],\"category\":\"documentation\",\"externalUrl\":null,\"createdAt\":\"2026-08-30T10:29:38.872Z\",\"updatedAt\":\"2026-08-30T10:59:13.941Z\",\"publishedAt\":\"2026-08-30T10:59:13.953Z\",\"locale\":\"fr\"},{\"id\":7,\"documentId\":\"ritmw5urp8u3z6qmu9rgfni4\",\"title\":\"Zenbaki erabilgarriak\",\"slug\":\"numeros-utiles\",\"summary\":\"Behar izanez gero ezagutu beharreko telefono zenbaki nagusiak.\",\"description\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Entzute, larrialdi eta laguntza zerbitzuetarako kontaktu erabilgarrien hautaketa.\"}]}],\"category\":\"documentation\",\"externalUrl\":null,\"createdAt\":\"2026-08-30T10:30:56.489Z\",\"updatedAt\":\"2026-08-30T10:59:01.177Z\",\"publishedAt\":\"2026-08-30T10:59:01.186Z\",\"locale\":\"eu\"}],\"joins\":[{\"id\":29,\"documentId\":\"rsqbvy47193yzes7jv0w7lsz\",\"title\":\"Nous soutenir\",\"description\":\"\",\"createdAt\":\"2026-09-18T10:09:39.612Z\",\"updatedAt\":\"2026-09-26T09:19:12.056Z\",\"publishedAt\":\"2026-09-26T09:19:12.072Z\",\"locale\":\"fr\",\"slug\":null,\"volunteerTitle\":\"Devenir bénévole\",\"volunteerText\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Vous souhaitez vous engager aux côtés d'Emazteen Etxea - la Maison des Femmes ? Vous pouvez nous rejoindre comme bénévole et proposer votre temps, vos compétences. Chacune trouve sa place, chacune découvre et se forme au fil des tâches.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"C’est un moyen d’apprendre comme de partager ses compétences. Nous avons toutes quelque chose à apporter.\"}]}],\"patronTitle\":\"Devenir mécène\",\"patronText\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Vous représentez une entreprise ou une fondation et souhaitez soutenir Emazteen Etxea - la Maison des Femmes pour affirmez votre engagement sociétal et renforcer votre ancrage territorial.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Le mécénat peut prendre plusieurs formes : un don financier, un don de matériel, ou un mécénat de compétences — la mise à disposition d'un savoir-faire, de temps, de biens ou de services.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Votre entreprise peut bénéficier d'une réduction d'impôt de 60 % du montant de votre don. Chaque soutien s'adapte à vos moyens et à vos disponibilités : pour construire un partenariat ensemble, contactez-nous via le formulaire du site.\"}]}],\"financialTitle\":\"Nous soutenir financièrement\",\"financialText\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Vous souhaitez soutenir financièrement Emazteen Etxea - la Maison des Femmes ? Chaque don, ponctuel ou régulier, nous aide à faire vivre nos permanences, nos ateliers et nos actions de sensibilisation.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Nous cherchons notamment à financer un groupe de parole animé par une psychologue professionnelle.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}]}],\"about_pages\":[{\"id\":47,\"documentId\":\"e52vp2zytnjpqzjajhyg3spg\",\"title\":\"Qui sommes-nous?\",\"slug\":\"qui-sommes-nous\",\"summary\":\"La Maison des Femmes est un lieu d’accueil, d’écoute, d’information et d’accompagnement destiné aux femmes du territoire.\",\"description\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Emazteen Etxea — Maison des Femmes d'Iparralde, c'est un collectif de femmes d'horizons différents, bénévoles, réunies autour d'une conviction simple : le féminisme, l'égalité, l'émancipation, ça se construit à plusieurs. On partage, on se soutient, on se valorise, on avance — dans un espace vivant, ouvert à toutes, où on est plus fortes ensemble. \"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Respect. Équité. Liberté. Adelphité. Féminisme\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"createdAt\":\"2026-08-30T11:42:17.424Z\",\"updatedAt\":\"2026-09-25T16:52:10.980Z\",\"publishedAt\":\"2026-09-25T16:52:11.001Z\",\"locale\":\"fr\",\"displayOrder\":null},{\"id\":40,\"documentId\":\"e52vp2zytnjpqzjajhyg3spg\",\"title\":\"orria — Nortzuk  gara?\",\"slug\":\"qui-sommes-nous\",\"summary\":\"Emakumeen Etxea lurraldeko emakumeei zuzendutako harrera, entzute, informazio eta laguntza gunea da.\",\"description\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Iparraldeko Emakumeen Etxea, jatorri eta ibilbide ezberdinetako emakumez osatutako bolondres talde bat gara. Eta Konbentzimendu sinple batek erakarrita batu gara : feminismoa, berdintasuna eta emantzipazioa hainbat lagunen artean eraikitzen da. Momentuak partekatu, elkar babestu, balorizatu  eta aintzina egiten dugu . Gure elkartera guztiei irekita dagoen gune bizi bat da. Batzeko toki bat da, elkarrekin indartsuagoak baikara. \"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Errespetua. Ekitatea. Askatasuna. Ahizpatasuna. Feminismoa\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"createdAt\":\"2026-08-30T11:43:03.108Z\",\"updatedAt\":\"2026-09-25T09:18:40.125Z\",\"publishedAt\":\"2026-09-25T09:18:40.145Z\",\"locale\":\"eu\",\"displayOrder\":null},{\"id\":37,\"documentId\":\"tqmv96i3e5j5ppoqqpzd19em\",\"title\":\"Où va-t-on ?\",\"slug\":\"ou-va-t-on\",\"summary\":null,\"description\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Notre ambition est grande : la Maison des Femmes d’Urrugne est la première des dix maisons que nous souhaitons développer en Iparralde. \"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Dans le futur, chaque femme du territoire pourrait avoir un lieu d’accueil et de ressources à moins de 30 min de chez elle. »\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Ces futures Maisons des Femmes naîtront à l'initiative de groupes locaux de femmes qui souhaitent voir émerger, près de chez elles, un lieu qui leur ressemble. Nous les accompagnons dans cette démarche : notre soutien, notre expérience et nos outils sont mis à leur disposition.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"createdAt\":\"2026-09-23T21:38:26.406Z\",\"updatedAt\":\"2026-09-25T09:17:05.038Z\",\"publishedAt\":\"2026-09-25T09:17:05.073Z\",\"locale\":\"fr\",\"displayOrder\":null},{\"id\":38,\"documentId\":\"n700ty2l0e2r898us7msseme\",\"title\":\"Emazteen Etxea – la Maison des Femmes a pour projet de :\",\"slug\":\"projet\",\"summary\":null,\"description\":[{\"type\":\"list\",\"format\":\"unordered\",\"children\":[{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Sensibiliser et prévenir les violences \"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Accueillir, écouter et orienter les femmes victimes de violences. \"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Lutter contre les inégalités, les discriminations, le sexisme, le patriarcat — sous toutes leurs formes. \"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Diffuser la pensée féministe. \"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Promouvoir les droits des femmes et plaider pour l'égalité des genres. \"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Ouvrir des espaces de rencontres et de co-création accessibles à toutes\"}]}]}],\"createdAt\":\"2026-09-23T21:41:23.800Z\",\"updatedAt\":\"2026-09-25T09:17:36.505Z\",\"publishedAt\":\"2026-09-25T09:17:36.530Z\",\"locale\":\"fr\",\"displayOrder\":null},{\"id\":44,\"documentId\":\"n700ty2l0e2r898us7msseme\",\"title\":\"Emazteen Etxeak helburu hauek ditu :\",\"slug\":\"projet\",\"summary\":null,\"description\":[{\"type\":\"list\",\"format\":\"unordered\",\"children\":[{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Indarkeriaren inguruan sentsibilizazioa eta prebentzioa bultzatu.\"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Indarkeria jasaten duten emakumeei harrera egitea, entzutea eta orientatzea.\"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Desberdintasunen, diskriminazioen, sexismoaren eta patriarkatuaren aurka borrokatzea — beren forma guztietan.\"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Pentsamendu feminista zabaltzea.\"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Emakumeen eskubideak sustatzea eta genero-berdintasunaren alde egitea. Guztientzat eskuragarri dauden topaketa- eta elkarlan-sorkuntzarako guneak irekitzea.\"}]}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"createdAt\":\"2026-09-23T21:39:51.357Z\",\"updatedAt\":\"2026-09-25T09:24:04.249Z\",\"publishedAt\":\"2026-09-25T09:24:04.267Z\",\"locale\":\"eu\",\"displayOrder\":null},{\"id\":41,\"documentId\":\"tqmv96i3e5j5ppoqqpzd19em\",\"title\":\"Nora goaz?\",\"slug\":\"ou-va-t-on\",\"summary\":null,\"description\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Gure anbizioa handia da: Urruñeko Emakumeen Etxea Iparraldean garatu nahi ditugun hamar etxeetatik lehena da.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Etorkizunean, lurraldeko emakume bakoitzak bere etxetik 30 minuturtara baino gutxiagora harrera- eta baliabide-gune bat izatea nahi genuke.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Etorkizuneko Emakumeen Etxe hauek tokian tokiko emakume-taldeen ekimenez sortuko dira, beren inguruan haien neurriko gune bat sortzea nahi duten taldeen ekimenez. Prozesu horretan laguntzen diegu: gure laguntza, esperientzia eta tresnak haien eskura jartzen ditugu.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"createdAt\":\"2026-09-23T21:39:08.816Z\",\"updatedAt\":\"2026-09-25T09:18:50.144Z\",\"publishedAt\":\"2026-09-25T09:18:50.167Z\",\"locale\":\"eu\",\"displayOrder\":null},{\"id\":39,\"documentId\":\"ooqoohld9s1k296h60162hz3\",\"title\":\"L'équipe\",\"slug\":\"equipe\",\"summary\":\"Chez nous, la gouvernance n'est pas qu'une question d'organigramme : elle traduit nos valeurs. On fonctionne de façon collégiale, à plusieurs échelles, pour que les décisions ne reposent jamais sur une seule personne.\",\"description\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Le bureau\",\"underline\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Deux à trois personnes partagent la co-représentation de l’association, à égalité.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Actuellement Emeline Canet Mekdour et Véronique de la Devèze sont les co-représentantes d’Emazteen Etxea, la Maison des Femmes\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Le conseil collégia\",\"underline\":true},{\"type\":\"text\",\"text\":\"l\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"5 à 8 femmes partagent les décisions stratégiques de l'association.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"La coordination\",\"underline\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Une coordinatrice salariée à temps partiel assure la continuité de la structure au quotidien et le lien entre les différentes commissions et activités.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"L'équipe bénévole\",\"underline\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Autour d'elles, une équipe de bénévoles fait vivre nos actions sur le terrain, jour après jour.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Une gouvernance à plusieurs voix, pour une maison qui appartient à toutes.\",\"bold\":true,\"italic\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"createdAt\":\"2026-09-25T08:08:38.645Z\",\"updatedAt\":\"2026-09-25T09:17:51.734Z\",\"publishedAt\":\"2026-09-25T09:17:51.747Z\",\"locale\":\"fr\",\"displayOrder\":null},{\"id\":43,\"documentId\":\"ooqoohld9s1k296h60162hz3\",\"title\":\"Taldea\",\"slug\":\"equipe\",\"summary\":\"Gure antolatzeko moduak gure izaera islatzen du. Modu kolegiatuan funtzionatzen dugu: erabakiak ez dira inoiz, pertsona bakar baten esku geratzen. \",\"description\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Bulegoa\",\"underline\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Bi edo hiru lagunek elkartearen ordezkaritza ein berean partekatzen dute.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Gaur egun, Emeline Canet Mekdour eta Véronique de la Devèze dira Iparraldeko Emakumeen Etxearen ordezkariak.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Kontseilu kolegiatua\",\"underline\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\" Elkartearen erabaki estrategikoak  bost eta zortzi emakumeren artean partzekatzen dira. \"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Koordinazioa\",\"underline\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Lanaldi partzialeko koordinatzaile kontratatu batek eguneroko egituraren jarraipena eta,  batzorde eta jarduera ezberdinen arteko lotura bermatzen ditu.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Bolondres-taldea\",\"underline\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Haien inguruan, bolondres-talde batek eguneroko ekintzak biziarazten ditu.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\",\"bold\":true,\"italic\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Ahots anitzeko gobernantza, guztiona den etxe baterako.\",\"bold\":true,\"italic\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"createdAt\":\"2026-09-25T08:10:05.204Z\",\"updatedAt\":\"2026-09-25T09:19:14.646Z\",\"publishedAt\":\"2026-09-25T09:19:14.666Z\",\"locale\":\"eu\",\"displayOrder\":null}],\"partners\":[],\"localizations\":[{\"id\":
