hitz egiten dute emakume bati buruz. 2015etik, Wiki Emakumeok mugimendua hori aldatzen ari da,. Oarso-Bidasoako taldeak (Oiartzun, Lezo, Hendaia) nola egiten duten erakustera etorriko dira.\\n\\n•\\tOarso-Bidasoako Wiki Emakumeok taldearekin topaketa\\n•\\t«WikiEmakumeOK DOnK» dokumentalaren proiekzioa\\n•\\tUrruñan Wiki Emakumeok talde iraunkor bat sortzeko tailer parte-hartzailea\\n\",\"category\":\"evenement\",\"startTime\":\"2026-09-26T13:00:00.000Z\",\"endTime\":\"2026-09-26T17:00:00.000Z\",\"registrationRequired\":false,\"registrationDeadline\":null,\"capacity\":null,\"createdAt\":\"2026-08-30T09:38:01.175Z\",\"updatedAt\":\"2026-09-25T13:12:40.576Z\",\"publishedAt\":\"2026-09-25T13:12:40.616Z\",\"locale\":\"eu\",\"location\":\"Urruñako Emakumeen Etxea\",\"pricingType\":\"free\",\"price\":null},{\"id\":48,\"documentId\":\"u7jw8gv2ujxwuig8vz57zxwn\",\"title\":\"«Berdintasunerako bideak, itzaletik argira» erakusketaren inaugurazioa\",\"slug\":\"expo-baskelles\",\"summary\":null,\"description\":\"Bask'Ellesek, Bascos elkarteko Emakumeen Eskubideen taldeak (Euskal Herriko LGBT+ elkartea), bultzatuta, erakusketa honek Euskal Herriko emakume nabarmenen ibilbideak jasotzen ditu.\",\"category\":\"evenement\",\"startTime\":\"2026-09-26T17:00:00.000Z\",\"endTime\":\"2026-09-26T20:00:00.000Z\",\"registrationRequired\":false,\"registrationDeadline\":null,\"capacity\":null,\"createdAt\":\"2026-08-30T19:07:52.442Z\",\"updatedAt\":\"2026-09-25T13:07:01.252Z\",\"publishedAt\":\"2026-09-25T13:07:01.260Z\",\"locale\":\"eu\",\"location\":\"Urruñako Emakumeen Etxea\",\"pricingType\":\"free\",\"price\":null},{\"id\":96,\"documentId\":\"q0h88p6vh2g30cjfpxs8fslh\",\"title\":\"«Et pendant ce temps, Simone Veille» ikuskizuna\",\"slug\":\"simone\",\"summary\":\"3ème Rue konpainiaren eskutik\",\"description\":null,\"category\":\"evenement\",\"startTime\":\"2026-10-17T18:00:00.000Z\",\"endTime\":\"2026-10-17T19:30:00.000Z\",\"registrationRequired\":true,\"registrationDeadline\":\"2026-10-16T15:00:00.000Z\",\"capacity\":40,\"createdAt\":\"2026-09-26T03:47:05.263Z\",\"updatedAt\":\"2026-09-26T04:16:45.417Z\",\"publishedAt\":\"2026-09-26T04:16:45.430Z\",\"locale\":\"eu\",\"location\":\"Borderline Fabrikan - 64 Bd du Général de Gaulle, 64700 Hendaia\",\"pricingType\":\"pay_what_you_want\",\"price\":null}],\"action\":[],\"resources\":[],\"joins\":[{\"id\":28,\"documentId\":\"rsqbvy47193yzes7jv0w7lsz\",\"title\":\"Nola parte hartu\",\"description\":null,\"createdAt\":\"2026-09-18T10:12:30.915Z\",\"updatedAt\":\"2026-09-26T09:18:21.059Z\",\"publishedAt\":\"2026-09-26T09:18:21.070Z\",\"locale\":\"eu\",\"slug\":null,\"volunteerTitle\":\"Bolondres gisa\",\"volunteerText\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Iparraldeko Emakumeen Etxean parte hartzeko konpromezua hartu nahi duzu? Bolondres gisa batu zaitezke eta zure denbora eta gaitasunak eskaini. Bakoitzak bere lekua aurkitzen du, eta bakoitzak zereginetan zehar ikasi eta trebatzen du.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Ikasteko eta norberaren gaitasunak partekatzeko modu bat da. Denok dugu zerbait eskaintzeko.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Konpromiso bakoitzak du garrantzia, puntualak zein erregularrak. Informazio gehiago nahi izanez gero, jar zaitez gurekin harremanetan webguneko galdeketaren bidez.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"patronTitle\":\"Babesle izatea\",\"patronText\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Enpresa edo fundazio bat ordezkatzen duzu eta Iparraldeko Emakumeen Etxea babestu nahi duzu, konpromiso soziala adierazi eta lurraldearekiko atxikimendua indartzeko?\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Hainba modutara babes daitek: diru-dohaintza, material-dohaintza edo gaitasun- ezagutza transmitituz, denbora, ondasun edo zerbitzuak eskuragarri jartzea.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Zure enpresak zure dohaintzaren zenbatekoaren %60ko zerga-murrizketa jaso dezake.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Laguntza bakoitza zure baliabideetara eta erabilgarri duzun denborara egokitzen da : elkarrekin lankidetza bat eraikitzeko, jar zaitez gurekin harremanetan webguneko galdeketaren bidez.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"financialTitle\":\"Ekonomikoki laguntzea\",\"financialText\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Iparraldeko Emakumeen Etxea diruz lagundu nahi duzu? Dohaintza bakoitzak, puntualak zein erregularrak, gure harrera-zerbitzuak, tailerrak eta sentsibilizazio-ekintzak aurrera eramaten laguntzen digu.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Bereziki, psikologo profesional batek gidatutako hitz-hartzea diruztatzeko laguntza xekatzen dugu.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Online egin dezakezu dohaintza, behin bakarrik edo hilero, gure HelloAsso orrian edo tokian bertan gure ekitaldietan.\"}]}]}],\"about_pages\":[{\"id\":44,\"documentId\":\"n700ty2l0e2r898us7msseme\",\"title\":\"Emazteen Etxeak helburu hauek ditu :\",\"slug\":\"projet\",\"summary\":null,\"description\":[{\"type\":\"list\",\"format\":\"unordered\",\"children\":[{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Indarkeriaren inguruan sentsibilizazioa eta prebentzioa bultzatu.\"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Indarkeria jasaten duten emakumeei harrera egitea, entzutea eta orientatzea.\"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Desberdintasunen, diskriminazioen, sexismoaren eta patriarkatuaren aurka borrokatzea — beren forma guztietan.\"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Pentsamendu feminista zabaltzea.\"}]},{\"type\":\"list-item\",\"children\":[{\"type\":\"text\",\"text\":\"Emakumeen eskubideak sustatzea eta genero-berdintasunaren alde egitea. Guztientzat eskuragarri dauden topaketa- eta elkarlan-sorkuntzarako guneak irekitzea.\"}]}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"createdAt\":\"2026-09-23T21:39:51.357Z\",\"updatedAt\":\"2026-09-25T09:24:04.249Z\",\"publishedAt\":\"2026-09-25T09:24:04.267Z\",\"locale\":\"eu\",\"displayOrder\":null},{\"id\":41,\"documentId\":\"tqmv96i3e5j5ppoqqpzd19em\",\"title\":\"Nora goaz?\",\"slug\":\"ou-va-t-on\",\"summary\":null,\"description\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Gure anbizioa handia da: Urruñeko Emakumeen Etxea Iparraldean garatu nahi ditugun hamar etxeetatik lehena da.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Etorkizunean, lurraldeko emakume bakoitzak bere etxetik 30 minuturtara baino gutxiagora harrera- eta baliabide-gune bat izatea nahi genuke.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Etorkizuneko Emakumeen Etxe hauek tokian tokiko emakume-taldeen ekimenez sortuko dira, beren inguruan haien neurriko gune bat sortzea nahi duten taldeen ekimenez. Prozesu horretan laguntzen diegu: gure laguntza, esperientzia eta tresnak haien eskura jartzen ditugu.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"createdAt\":\"2026-09-23T21:39:08.816Z\",\"updatedAt\":\"2026-09-25T09:18:50.144Z\",\"publishedAt\":\"2026-09-25T09:18:50.167Z\",\"locale\":\"eu\",\"displayOrder\":null},{\"id\":43,\"documentId\":\"ooqoohld9s1k296h60162hz3\",\"title\":\"Taldea\",\"slug\":\"equipe\",\"summary\":\"Gure antolatzeko moduak gure izaera islatzen du. Modu kolegiatuan funtzionatzen dugu: erabakiak ez dira inoiz, pertsona bakar baten esku geratzen. \",\"description\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Bulegoa\",\"underline\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Bi edo hiru lagunek elkartearen ordezkaritza ein berean partekatzen dute.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Gaur egun, Emeline Canet Mekdour eta Véronique de la Devèze dira Iparraldeko Emakumeen Etxearen ordezkariak.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Kontseilu kolegiatua\",\"underline\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\" Elkartearen erabaki estrategikoak  bost eta zortzi emakumeren artean partzekatzen dira. \"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Koordinazioa\",\"underline\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Lanaldi partzialeko koordinatzaile kontratatu batek eguneroko egituraren jarraipena eta,  batzorde eta jarduera ezberdinen arteko lotura bermatzen ditu.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Bolondres-taldea\",\"underline\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Haien inguruan, bolondres-talde batek eguneroko ekintzak biziarazten ditu.\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\",\"bold\":true,\"italic\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Ahots anitzeko gobernantza, guztiona den etxe baterako.\",\"bold\":true,\"italic\":true}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"createdAt\":\"2026-09-25T08:10:05.204Z\",\"updatedAt\":\"2026-09-25T09:19:14.646Z\",\"publishedAt\":\"2026-09-25T09:19:14.666Z\",\"locale\":\"eu\",\"displayOrder\":null},{\"id\":40,\"documentId\":\"e52vp2zytnjpqzjajhyg3spg\",\"title\":\"orria — Nortzuk  gara?\",\"slug\":\"qui-sommes-nous\",\"summary\":\"Emakumeen Etxea lurraldeko emakumeei zuzendutako harrera, entzute, informazio eta laguntza gunea da.\",\"description\":[{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Iparraldeko Emakumeen Etxea, jatorri eta ibilbide ezberdinetako emakumez osatutako bolondres talde bat gara. Eta Konbentzimendu sinple batek erakarrita batu gara : feminismoa, berdintasuna eta emantzipazioa hainbat lagunen artean eraikitzen da. Momentuak partekatu, elkar babestu, balorizatu  eta aintzina egiten dugu . Gure elkartera guztiei irekita dagoen gune bizi bat da. Batzeko toki bat da, elkarrekin indartsuagoak baikara. \"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"Errespetua. Ekitatea. Askatasuna. Ahizpatasuna. Feminismoa\"}]},{\"type\":\"paragraph\",\"children\":[{\"type\":\"text\",\"text\":\"\"}]}],\"createdAt\":\"2026-08-30T11:43:03.108Z\",\"updatedAt\":\"2026-09-25T09:18:40.125Z\",\"publishedAt\":\"2026-09-25T09:18:40.145Z\",\"locale\":\"eu\",\"displayOrder\":null}],\"localizations\":[{\"id\":2,\"documentId\":\"j5fqfyf5nqtoff9abbs0cwlo\",\"name\":\"Maison des femmes Urrugne\",\"slug\":\"urrugne\",\"city\":\"Urrugne\",\"address\":\"Foyer municipal de Behobie - 3 Pl. de l'Eglise, Pl. de Pausu, 64122 Urrugne\",\"email\":null,\"phone\":null,\"facebookUrl\":\"https://www.facebook.com/p/Emazteen-Etxea-Maison-des-Femmes-du-Pays-Basque-100090929147172/?locale=fr_FR\",\"instagramUrl\":\"https://www.instagram.com/emazteenetxea.maisondesfemmes/\",\"donationUrl\":\"https://www.helloasso.com/associations/iparraldeko-emazteen-etxea-maison-des-femmes-d-iparralde\",\"defaultLocale\":null,\"createdAt\":\"2026-08-28T09:20:39.511Z\",\"up
